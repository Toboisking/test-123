name: cc-compile
run-name: cccompile-${{ github.event.client_payload.chat_id }}-${{ github.event.client_payload.message_id }}
on:
  repository_dispatch:
    types: [cc-compile]

permissions:
  actions: write
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android NDK
        run: |
          set -e
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin 2>/dev/null | sort | tail -1)
            if [ -n "$NDK_DIR" ]; then
              echo "NDK_BIN=$NDK_DIR" >> "$GITHUB_ENV"
            fi
          fi
          if [ -z "$NDK_BIN" ]; then
            echo "::warning::Android NDK not found, worker will auto-locate"
          else
            echo "Using NDK at: $NDK_BIN"
          fi

      - name: Cache TG Session
        uses: actions/cache@v4
        with:
          path: /opt/tg_sessions
          key: tg-session-v2
          save-always: true

      - name: Prepare session dir
        run: |
          sudo mkdir -p /opt/tg_sessions
          sudo chown -R $(whoami) /opt/tg_sessions

      - name: Restore TG sessions from secret
        env:
          TG_SESSIONS_B64: ${{ secrets.TG_SESSIONS_B64 }}
        run: |
          python3 - <<'PYEOF'
          import os, base64, tarfile, io
          raw = os.environ.get("TG_SESSIONS_B64", "")
          if not raw:
              print("No TG_SESSIONS_B64 secret set; session will be created on first run")
          else:
              tarfile.open(fileobj=io.BytesIO(base64.b64decode(raw))).extractall("/opt/tg_sessions")
              print("Restored sessions:", sorted(os.listdir("/opt/tg_sessions")))
          PYEOF

      - name: Run C/C++ Compile worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          PAYLOAD_FILE_URL: ${{ github.event.client_payload.file_url }}
          PAYLOAD_TG_FILE_PATH: ${{ github.event.client_payload.tg_file_path }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          PAYLOAD_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          PAYLOAD_ORIGINAL_MESSAGE_ID: ${{ github.event.client_payload.original_message_id }}
          PAYLOAD_FILENAME: ${{ github.event.client_payload.filename }}
          PAYLOAD_JOB_ID: ${{ github.event.client_payload.job_id }}
          PAYLOAD_IS_ADMIN: ${{ github.event.client_payload.is_admin }}
          PAYLOAD_IS_PREMIUM: ${{ github.event.client_payload.is_premium }}
          PAYLOAD_REPORT_URL: ${{ github.event.client_payload.report_url }}
          PAYLOAD_FILE_ID: ${{ github.event.client_payload.file_id }}
          PAYLOAD_NDK_BIN: ${{ env.NDK_BIN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}

        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q httpx pyrogram tgcrypto
          /tmp/venv/bin/python worker_cc_compile.py
