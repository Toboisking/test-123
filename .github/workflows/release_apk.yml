name: Build & Direct GitHub Release APK v2

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug --no-daemon || true

      - name: Auto Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Ghidra Mobile APK Release v1.0.${{ github.run_number }}"
          body: |
            🚀 **Automatic Push-Triggered APK Build**
            - **Commit:** `${{ github.sha }}`
            - **Ref:** `${{ github.ref }}`
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
